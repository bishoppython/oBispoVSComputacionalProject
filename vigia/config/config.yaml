camera:
  id: frente
  # 0 = webcam | caminho de vídeo (.mp4) para testes | URL RTSP
  # Câmera do homelab: VIGIA_CAMERA_SOURCE=rtsp://vigia:SENHA@192.168.1.108:8554/cam1 no .env
  source: 0
  # Stream de maior resolução só para snapshots (fase 5, VIGI stream1). null = usa o próprio frame.
  snapshot_source: null
  # Largura dos frames de análise. 1280 simula bem a VIGI C330I (2304x1296) reduzida.
  width: 1280
  reconnect_seconds: 5

detector:
  model: yolo11n.pt        # yolo11s.pt se sobrar GPU
  conf: 0.4
  device: 0                # "cpu" ou índice da GPU
  imgsz: 640
  tracker: bytetrack.yaml
  classes: [person, motorcycle]

zones_file: config/zones.yaml

loitering:
  default_threshold_s: 90
  grace_period_s: 4        # tolera sumiços curtos do track sem zerar o cronômetro
  occupancy_fallback: true # alerta também se a zona fica ocupada (qualquer ID) além do limiar

events:
  cooldown_s: 120          # evita spam do mesmo tipo de alerta na mesma zona
  snapshot_dir: data/snapshots

telegram:
  enabled: false           # o envio sai do hub no homelab (veja `hub`); true = envio direto

hub:
  enabled: true            # token em VIGIA_HUB_TOKEN (.env)
  url: http://192.168.1.108:8090
  heartbeat_s: 60          # o hub avisa "vigilância pausada" se parar de receber
  outbox_dir: data/outbox  # eventos aguardando envio se o homelab estiver fora

display:
  show_window: true
