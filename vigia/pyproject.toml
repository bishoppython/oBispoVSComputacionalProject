[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigia"
version = "0.1.0"
description = "Sistema local de segurança: permanência, atos suspeitos e reconhecimento facial com alertas no Telegram"
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.3",
  "lap>=0.5.12",            # usado pelo ByteTrack
  "opencv-python>=4.9",
  "numpy>=1.26",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
face = ["insightface>=0.7.3", "onnxruntime-gpu>=1.17", "psycopg[binary]>=3.1", "pgvector>=0.2.5"]
hub = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "fpdf2>=2.8"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
vigia = "vigia.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vigia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
