<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigia · Entrar</title>
<style>
  :root { --bg:#0f1216; --card:#181d24; --line:#2a313b; --text:#e7ebf0; --muted:#8b95a3; --accent:#3b82f6; --bad:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; }
  form { width:100%; max-width:340px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; }
  h1 { margin:0 0 4px; font-size:22px; } p { margin:0 0 20px; color:var(--muted); }
  input { width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--line); background:#0f1216; color:var(--text); font-size:15px; }
  button { width:100%; margin-top:12px; padding:11px; border:0; border-radius:9px; background:var(--accent); color:#fff; font-weight:600; font-size:15px; cursor:pointer; }
  .err { color:var(--bad); margin:10px 0 0; min-height:1.5em; font-size:14px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>🛡️ Vigia</h1>
  <p>Painel de monitoramento</p>
  <input type="password" name="password" placeholder="Senha do painel" autofocus required autocomplete="current-password">
  <button type="submit">Entrar</button>
  <div class="err" id="err"></div>
</form>
<script>
  const e = new URLSearchParams(location.search).get("erro");
  document.getElementById("err").textContent =
    e === "senha" ? "Senha incorreta." : e === "config" ? "Painel sem senha: defina HUB_PANEL_PASSWORD no .env do homelab." : "";
</script>
</body>
</html>
